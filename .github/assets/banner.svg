<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sahil Talaviya — AI Engineer and Full Stack Developer">
  <title>Sahil Talaviya — AI Engineer &amp; Full Stack Developer</title>

  <!--
    Animated with SMIL and CSS only — no JavaScript, because GitHub strips it
    from SVGs and renders them through an image proxy. Declarative animation is
    the only kind that survives that trip.

    Self-authored rather than pulled from a badge/animation service, for the same
    reason the site self-hosts its fonts: nothing here should depend on a third
    party still being up in two years.

    Colours are the site's own tokens — graphite #08090B, emerald #34D399.
  -->

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10" />
      <stop offset="55%" stop-color="#08090B" />
      <stop offset="100%" stop-color="#0A0F0D" />
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <!-- The dot matrix from the hero, at rest. -->
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#34D399" fill-opacity="0.16" />
    </pattern>

    <!-- Wipes the headline in from the left, once, on load. -->
    <clipPath id="reveal">
      <rect x="72" y="70" width="0" height="150">
        <animate attributeName="width" from="0" to="820" dur="1.1s"
                 begin="0.15s" fill="freeze" calcMode="spline"
                 keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;820" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .name  { font: 700 68px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F2F4F7; letter-spacing: -1.6px; }
    .role  { font: 500 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #34D399; letter-spacing: 0.2px; }
    .meta  { font: 400 15px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace; fill: #9BA3AF; }
    .stat  { font: 700 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #F2F4F7; }
    .cap   { font: 400 12px ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace; fill: #6B7480; letter-spacing: 1.4px; }

    /* Staggered breathing on the accent nodes. Slow — a banner that pulses
       quickly reads as a loading spinner. */
    .node { animation: pulse 4.2s ease-in-out infinite; transform-origin: center; }
    .node:nth-of-type(2) { animation-delay: 0.5s; }
    .node:nth-of-type(3) { animation-delay: 1.0s; }
    .node:nth-of-type(4) { animation-delay: 1.5s; }
    .node:nth-of-type(5) { animation-delay: 2.0s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.20; }
      50%      { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .node { animation: none; opacity: 0.5; }
    }
  </style>

  <rect width="1200" height="320" fill="url(#sky)" />
  <rect width="1200" height="320" fill="url(#dots)" />
  <ellipse cx="980" cy="90" rx="360" ry="240" fill="url(#glow)" />

  <!-- Headline, wiped in -->
  <g clip-path="url(#reveal)">
    <text class="name" x="72" y="132">Sahil Talaviya</text>
    <text class="role" x="74" y="176">AI Engineer &amp; Full Stack Developer</text>
  </g>

  <!-- Accent rule, drawn after the headline lands -->
  <rect x="74" y="200" width="0" height="3" rx="1.5" fill="url(#rule)">
    <animate attributeName="width" from="0" to="420" dur="0.9s" begin="0.9s"
             fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"
             keyTimes="0;1" values="0;420" />
  </rect>

  <text class="meta" x="74" y="240" opacity="0">
    sahiltalaviya-portfolio.netlify.app
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.5s" fill="freeze" />
  </text>

  <!-- Live nodes: the pulse is the only thing that keeps moving after load. -->
  <g>
    <circle class="node" cx="880" cy="238" r="4" fill="#34D399" />
    <circle class="node" cx="912" cy="238" r="4" fill="#34D399" />
    <circle class="node" cx="944" cy="238" r="4" fill="#34D399" />
    <circle class="node" cx="976" cy="238" r="4" fill="#34D399" />
    <circle class="node" cx="1008" cy="238" r="4" fill="#34D399" />
  </g>

  <!-- Figures, faded in last -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.2s" fill="freeze" />
    <text class="stat" x="880" y="120">3</text>
    <text class="cap"  x="880" y="140">ERP SYSTEMS</text>
    <text class="stat" x="984" y="120">7</text>
    <text class="cap"  x="984" y="140">AUTOMATIONS</text>
    <text class="stat" x="1096" y="120">18</text>
    <text class="cap"  x="1096" y="140">LAB EXHIBITS</text>
  </g>

  <rect x="0" y="317" width="1200" height="3" fill="#34D399" opacity="0.55" />
</svg>
